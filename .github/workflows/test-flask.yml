name: Test Flask Server & Client

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test-flask:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start Flask server in background
        run: |
          python app.py > server.log 2>&1 &
          echo "Server started with PID: $!"

      - name: Wait for server to be ready
        run: |
          echo "Waiting for Flask to start on http://localhost:5000/health..."
          timeout 30s bash -c '
            until curl -f -s http://localhost:5000/health > /dev/null 2>&1; do
              echo "Still waiting..."
              sleep 1
            done
          ' || { echo "Server failed to start"; cat server.log; exit 1; }
          echo "Server is up!"

      - name: Run client tests
        run: |
          python client_test.py

      - name: Show server logs (on failure)
        if: failure()
        run: |
          echo "=== SERVER LOGS ==="
          cat server.log
