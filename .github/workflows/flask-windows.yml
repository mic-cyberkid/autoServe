# .github/workflows/flask-windows-debug.yml
name: Flask – Windows (debug)

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # -------------------------------------------------
      # 1. Start Flask with explicit CWD + live tail
      # -------------------------------------------------
      - name: Start Flask (background job)
        run: |
          $log = "$env:RUNNER_TEMP\flask.log"
          $repo = $PWD.Path   # <-- important: absolute repo root

          Start-Job -Name Flask -ScriptBlock {
            Set-Location $using:repo
            python "$using:repo\app.py" > $using:log 2>&1
          } | Out-Null

          Write-Host "Flask job started. Log: $log"
          # Show first few lines immediately
          Start-Sleep -Seconds 1
          Get-Content $log -Tail 5 -ErrorAction SilentlyContinue

      # -------------------------------------------------
      # 2. **Live tail** of server log while waiting
      # -------------------------------------------------
      - name: Tail server log (live)
        run: |
          $log = "$env:RUNNER_TEMP\flask.log"
          $tail = Start-Job -ScriptBlock {
            $path = $using:log
            while ($true) {
              Get-Content $path -Tail 1 -Wait -ErrorAction SilentlyContinue
            }
          }

      # -------------------------------------------------
      # 3. Wait for /health – with **debug output**
      # -------------------------------------------------
      - name: Wait for server (max 60 s)
        run: |
          $url = "http://127.0.0.1:5000/health"
          $max = 60
          $i   = 0

          while ($i -lt $max) {
            try {
              $resp = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 3 -Method Get
              if ($resp.StatusCode -eq 200) {
                Write-Host "Server READY after $($i)s"
                break
              }
            }
            catch {
              Write-Host "Attempt $($i+1)/$max – $_"
            }
            Start-Sleep -Seconds 1
            $i++
          }

          if ($i -eq $max) {
            Write-Error "Server never became healthy"
            Get-Content "$env:RUNNER_TEMP\flask.log" | Select-Object -Last 50
            exit 1
          }

      # -------------------------------------------------
      # 4. Run client
      # -------------------------------------------------
      - name: Run client tests
        run: python client_test.py

      # -------------------------------------------------
      # 5. Always show full log + stop job
      # -------------------------------------------------
      - name: Show full server log
        if: always()
        run: |
          Write-Host "=== FULL FLASK LOG ==="
          Get-Content "$env:RUNNER_TEMP\flask.log" -ErrorAction SilentlyContinue

      - name: Stop Flask job
        if: always()
        run: |
          Get-Job -Name Flask | Stop-Job -PassThru | Remove-Job
          Get-Job | Where-Object Name -like '*tail*' | Stop-Job -PassThru | Remove-Job
