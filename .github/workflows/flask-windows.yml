# .github/workflows/flask-windows.yml
name: Flask Windows CI

on: [push, pull_request]

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # -------------------------------------------------
      # 1. Start Flask — USING FULL PYTHON PATH
      # -------------------------------------------------
      - name: Start Flask server
        run: |
          $python = (Get-Command python).Path
          $log = "$env:RUNNER_TEMP\flask.log"
          $repo = $PWD.Path

          Write-Host "Using Python: $python"
          Write-Host "Log file: $log"
          Write-Host "Repo: $repo"

          Start-Job -Name Flask -ArgumentList $python,$repo,$log -ScriptBlock {
            param($py, $dir, $logFile)
            Set-Location $dir
            & $py "$dir\app.py" > $logFile 2>&1
          } | Out-Null

          Write-Host "Flask job started (PID: $((Get-Job -Name Flask).Id))"

      # -------------------------------------------------
      # 2. Wait for port 5000
      # -------------------------------------------------
      - name: Wait for port 5000
        run: |
          $max = 60
          for ($i = 0; $i -lt $max; $i++) {
            $conn = Get-NetTCPConnection -LocalPort 5000 -State Listen -ErrorAction SilentlyContinue
            if ($conn) {
              Write-Host "Port 5000 LISTENING after $($i)s"
              break
            }
            Start-Sleep -Seconds 1
          }
          if (!$conn) {
            Write-Error "Port 5000 never opened"
            Get-Content "$env:RUNNER_TEMP\flask.log" -ErrorAction SilentlyContinue
            Get-Job -Name Flask | Receive-Job
            exit 1
          }

      # -------------------------------------------------
      # 3. Wait for /health
      # -------------------------------------------------
      - name: Wait for /health
        run: |
          $url = "http://127.0.0.1:5000/health"
          $max = 30
          for ($i = 0; $i -lt $max; $i++) {
            try {
              $r = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 2
              if ($r.StatusCode -eq 200) { Write-Host "Server healthy"; break }
            } catch { Write-Host "Still waiting... ($i)" }
            Start-Sleep -Seconds 1
          }
          if ($i -ge $max) { Write-Error "Health check failed"; exit 1 }

      # -------------------------------------------------
      # 4. Run client
      # -------------------------------------------------
      - name: Run client tests
        run: python client_test.py

      # -------------------------------------------------
      # 5. Always show logs
      # -------------------------------------------------
      - name: Show Flask log
        if: always()
        run: |
          Write-Host "=== FLASK LOG ==="
          Get-Content "$env:RUNNER_TEMP\flask.log" -ErrorAction SilentlyContinue

      - name: Stop Flask job
        if: always()
        run: |
          Get-Job -Name Flask | Stop-Job -PassThru | Remove-Job -Force
