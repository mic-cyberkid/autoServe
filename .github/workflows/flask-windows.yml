# .github/workflows/flask-windows.yml
name: Flask Windows CI

on: [push, pull_request]

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # -------------------------------------------------
      # 1. Start Flask — PASS VARIABLES CORRECTLY
      # -------------------------------------------------
      - name: Start Flask server
        run: |
          $logPath = "$env:RUNNER_TEMP\flask.log"
          $repoPath = $PWD.Path

          # CRITICAL: Pass variables via -ArgumentList
          Start-Job -Name Flask -ArgumentList $repoPath,$logPath -ScriptBlock {
            param($repo, $log)
            Set-Location $repo
            python "$repo\app.py" > $log 2>&1
          } | Out-Null

          Write-Host "Flask job started. Log: $logPath"
          Write-Host "Repo path: $repoPath"

      # -------------------------------------------------
      # 2. Wait for port 5000 to be LISTENING (TCP level)
      # -------------------------------------------------
      - name: Wait for port 5000
        run: |
          $max = 60
          for ($i = 0; $i -lt $max; $i++) {
            $conn = Get-NetTCPConnection -LocalPort 5000 -State Listen -ErrorAction SilentlyContinue
            if ($conn) {
              Write-Host "Port 5000 is OPEN after $($i)s"
              break
            }
            if ($i -eq ($max-1)) {
              Write-Error "Port 5000 never opened!"
              Get-Job -Name Flask | Receive-Job
              Get-Content "$env:RUNNER_TEMP\flask.log" -ErrorAction SilentlyContinue
              exit 1
            }
            Start-Sleep -Seconds 1
          }

      # -------------------------------------------------
      # 3. Wait for HTTP /health
      # -------------------------------------------------
      - name: Wait for /health
        run: |
          $url = "http://127.0.0.1:5000/health"
          $max = 30
          for ($i = 0; $i -lt $max; $i++) {
            try {
              $r = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 2
              if ($r.StatusCode -eq 200) {
                Write-Host "/health OK"
                break
              }
            } catch {}
            if ($i -eq ($max-1)) {
              Write-Error "Health check failed"
              exit 1
            }
            Start-Sleep -Seconds 1
          }

      # -------------------------------------------------
      # 4. Run client
      # -------------------------------------------------
      - name: Run client tests
        run: python client_test.py

      # -------------------------------------------------
      # 5. Always show logs + cleanup
      # -------------------------------------------------
      - name: Show Flask output
        if: always()
        run: |
          Write-Host "=== FLASK LOG ==="
          Get-Content "$env:RUNNER_TEMP\flask.log" -ErrorAction SilentlyContinue
          Write-Host "=== JOB OUTPUT ==="
          Get-Job -Name Flask | Receive-Job

      - name: Stop Flask job
        if: always()
        run: |
          Get-Job -Name Flask | Stop-Job -PassThru | Remove-Job -Force
