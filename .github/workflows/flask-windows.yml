# .github/workflows/flask-windows.yml
name: Flask – Windows CI

on: [push, pull_request]

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # -------------------------------------------------
      # 1. Start Flask in background (with CWD fix)
      # -------------------------------------------------
      - name: Start Flask server
        run: |
          $log = "$env:RUNNER_TEMP\flask.log"
          $repo = $PWD.Path

          Start-Job -Name Flask -ScriptBlock {
            Set-Location $using:repo
            python "$using:repo\app.py" > $using:log 2>&1
          } | Out-Null

          Write-Host "Flask started. Waiting for port 5000..."

      # -------------------------------------------------
      # 2. Wait for TCP port 5000 to be LISTENING
      # -------------------------------------------------
      - name: Wait for port 5000 (TCP)
        run: |
          $timeout = 60
          $elapsed = 0
          while ($elapsed -lt $timeout) {
            $connection = Get-NetTCPConnection -LocalPort 5000 -State Listen -ErrorAction SilentlyContinue
            if ($connection) {
              Write-Host "Port 5000 is LISTENING"
              break
            }
            Start-Sleep -Seconds 1
            $elapsed++
          }
          if ($elapsed -ge $timeout) {
            Write-Error "Port 5000 never opened"
            Get-Content "$env:RUNNER_TEMP\flask.log"
            exit 1
          }

      # -------------------------------------------------
      # 3. Wait for HTTP /health to return 200
      # -------------------------------------------------
      - name: Wait for /health endpoint
        run: |
          $url = "http://127.0.0.1:5000/health"
          $timeout = 30
          $elapsed = 0
          while ($elapsed -lt $timeout) {
            try {
              $resp = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 2
              if ($resp.StatusCode -eq 200) {
                Write-Host "Server is healthy!"
                break
              }
            } catch { }
            Start-Sleep -Seconds 1
            $elapsed++
          }
          if ($elapsed -ge $timeout) {
            Write-Error "Server did not respond to /health"
            Get-Content "$env:RUNNER_TEMP\flask.log"
            exit 1
          }

      # -------------------------------------------------
      # 4. Run client
      # -------------------------------------------------
      - name: Run client tests
        run: python client_test.py

      # -------------------------------------------------
      # 5. Cleanup
      # -------------------------------------------------
      - name: Show logs (on failure)
        if: failure()
        run: Get-Content "$env:RUNNER_TEMP\flask.log"

      - name: Stop Flask
        if: always()
        run: |
          Get-Job -Name Flask | Stop-Job -PassThru | Remove-Job
