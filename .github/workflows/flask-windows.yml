name: Flask – Windows CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 15

    defaults:
      run:
        shell: pwsh   # PowerShell Core – works great with Windows background jobs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Upgrade pip & install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # -------------------------------------------------
      # 1. Start Flask in the background
      # -------------------------------------------------
      - name: Start Flask server (background)
        run: |
          $log = "$env:RUNNER_TEMP\server.log"
          Start-Job -ScriptBlock {
            python "$using:PWD\app.py" > $using:log 2>&1
          } | Out-Null
          Write-Host "Flask job started – log: $log"

      # -------------------------------------------------
      # 2. Wait for /health endpoint (max 30 s)
      # -------------------------------------------------
      - name: Wait for server to be ready
        run: |
          $max = 30
          $i   = 0
          while ($i -lt $max) {
            try {
              $resp = Invoke-WebRequest -Uri http://127.0.0.1:5000/health -UseBasicParsing -TimeoutSec 2
              if ($resp.StatusCode -eq 200) {
                Write-Host "Server ready!"
                break
              }
            } catch { }
            Start-Sleep -Seconds 1
            $i++
          }
          if ($i -eq $max) {
            Write-Error "Server did not become healthy in $max seconds"
            Get-Content "$env:RUNNER_TEMP\server.log" -ErrorAction SilentlyContinue
            exit 1
          }

      # -------------------------------------------------
      # 3. Run client tests
      # -------------------------------------------------
      - name: Run client tests
        run: |
          python client_test.py

      # -------------------------------------------------
      # 4. (Optional) Show server log on failure
      # -------------------------------------------------
      - name: Show server log on failure
        if: failure()
        run: |
          Write-Host "=== SERVER LOG ==="
          Get-Content "$env:RUNNER_TEMP\server.log" -ErrorAction SilentlyContinue

      # -------------------------------------------------
      # 5. Clean up background job (always)
      # -------------------------------------------------
      - name: Stop Flask job
        if: always()
        run: |
          Get-Job | Stop-Job -PassThru | Remove-Job
